<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>James-Jarvis Analytics</title>
<style>
  :root { --bg:#0d1213; --panel:#151c1e; --line:#2a3537; --text:#f0f2ef; --muted:#9aa6a3; --green:#3ddc84; --red:#ff5a5a; --amber:#e0b84a; --mint:#9fe3c0; --pink:#e58bd0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,"Segoe UI",sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 16px 48px; }
  header { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; padding:22px 0; }
  h1 { margin:0; font-size:26px; letter-spacing:-.02em; }
  h1 span { background:linear-gradient(90deg,var(--mint),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input, select, button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  input { min-width:0; }
  button { cursor:pointer; }
  button.primary { background:var(--mint); color:#0d1213; border-color:var(--mint); font-weight:700; }
  .status { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .status i { width:9px; height:9px; border-radius:50%; background:var(--amber); }
  .status[data-s="ok"] i { background:var(--green); box-shadow:0 0 8px var(--green); }
  .status[data-s="err"] i { background:var(--red); }
  .kpis { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  .kpi, .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .kpi small { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .kpi strong { display:block; font-size:30px; line-height:1.2; margin-top:4px; font-variant-numeric:tabular-nums; }
  .kpi em { font-style:normal; font-size:12px; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:2fr 1fr; gap:12px; margin-bottom:12px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:12px; }
  h2 { margin:0 0 12px; font-size:15px; }
  .chart { width:100%; height:200px; display:block; }
  .chart text { fill:var(--muted); font-size:10px; }
  .bars { display:grid; gap:8px; }
  .bar { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; font-size:13px; }
  .bar div { grid-column:1/-1; height:6px; border-radius:3px; background:#232d2f; overflow:hidden; }
  .bar div b { display:block; height:100%; background:var(--mint); border-radius:3px; }
  .bar span:last-child { color:var(--muted); font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  td code { font-size:12px; color:var(--muted); word-break:break-all; }
  .lvl { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; }
  .lvl.error { background:#ff5a5a22; color:var(--red); } .lvl.warning { background:#e0b84a22; color:var(--amber); } .lvl.info { background:#3ddc8422; color:var(--green); }
  .empty, .err { color:var(--muted); padding:24px 0; text-align:center; }
  .err { color:var(--red); }
  .tablewrap { overflow-x:auto; }
  @media (max-width:900px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } .grid2, .grid3 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>James-Jarvis <span>Analytics</span></h1>
    <div class="controls">
      <span class="status" id="status" data-s="load"><i></i><span>Lädt …</span></span>
      <select id="range" aria-label="Zeitraum"><option value="7">7 Tage</option><option value="14" selected>14 Tage</option><option value="30">30 Tage</option><option value="0">Alles</option></select>
      <input id="token" type="password" placeholder="Token (optional)" aria-label="Zugangstoken" size="16">
      <button id="reload">Neu laden</button>
      <a href="liste.html" style="color:var(--muted);font-size:13px">Fehlerliste</a>
      <button class="primary" id="copy">Alles kopieren</button>
    </div>
  </header>

  <section class="kpis">
    <div class="kpi"><small>Berichte</small><strong id="k-total">–</strong><em>im Zeitraum</em></div>
    <div class="kpi"><small>Letzte 24 h</small><strong id="k-day">–</strong><em id="k-trend">&nbsp;</em></div>
    <div class="kpi"><small>Fehler</small><strong id="k-err">–</strong><em>Stufe „error“</em></div>
    <div class="kpi"><small>Versionen</small><strong id="k-ver">–</strong><em id="k-latest">&nbsp;</em></div>
    <div class="kpi"><small>Störungen gesamt</small><strong id="k-inc">–</strong><em>Summe der Zähler</em></div>
  </section>

  <section class="grid2">
    <div class="card"><h2>Berichte pro Tag</h2><svg class="chart" id="chart" role="img" aria-label="Berichte pro Tag"></svg></div>
    <div class="card"><h2>Nach Stufe</h2><div class="bars" id="by-level"></div></div>
  </section>

  <section class="grid3">
    <div class="card"><h2>Nach Version</h2><div class="bars" id="by-version"></div></div>
    <div class="card"><h2>Nach System</h2><div class="bars" id="by-platform"></div></div>
    <div class="card"><h2>Häufigste Meldungen</h2><div class="bars" id="by-message"></div></div>
  </section>

  <section class="card">
    <h2>Neueste Berichte</h2>
    <div class="tablewrap"><table><thead><tr><th>Zeit</th><th>Stufe</th><th>Meldung</th><th>Version</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div id="note" class="empty" hidden></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id)
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const DAY = 86400000
let all = []

$('token').value = store.get('jj-token') || ''
$('range').value = store.get('jj-range') || '14'

function parse(r) {
  let d = {}
  try { d = JSON.parse(r.details || '{}') || {} } catch {}
  return { ...r, t: Date.parse(r.timestamp), version: d.appVersion || 'unbekannt', platform: d.platform || 'unbekannt', incidents: Number(d.incidents ?? d.problems ?? 0) || 0 }
}

function setStatus(s, text) { $('status').dataset.s = s; $('status').lastElementChild.textContent = text }

async function load() {
  setStatus('load', 'Lädt …')
  const token = $('token').value.trim()
  store.set('jj-token', token)
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 15000)
  try {
    const res = await fetch('/api/error-report?kind=incident&limit=200', { cache: 'no-store', signal: ctrl.signal, headers: token ? { Authorization: 'Bearer ' + token } : {} })
    if (res.status === 401) throw new Error('Token fehlt oder falsch.')
    if (!res.ok) throw new Error('API antwortet mit HTTP ' + res.status + '.')
    const body = await res.json()
    all = (body.reports || []).map(parse).filter(r => Number.isFinite(r.t))
    setStatus('ok', all.length + ' Berichte geladen · ' + new Date().toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' }))
    render()
  } catch (e) {
    setStatus('err', e.name === 'AbortError' ? 'Zeitüberschreitung' : e.message)
    $('note').hidden = false; $('note').className = 'err'; $('note').textContent = 'Daten konnten nicht geladen werden: ' + (e.name === 'AbortError' ? 'Zeitüberschreitung.' : e.message)
  } finally { clearTimeout(timer) }
}

function inRange() {
  const days = Number($('range').value)
  return days ? all.filter(r => r.t >= Date.now() - days * DAY) : all
}

function bars(el, rows) {
  const max = Math.max(1, ...rows.map(r => r[1]))
  el.innerHTML = rows.length ? rows.map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><span>${v}</span><div><b style="width:${(v / max * 100).toFixed(1)}%"></b></div></div>`).join('') : '<div class="empty">Keine Daten</div>'
}
const countBy = (list, key) => [...list.reduce((m, r) => m.set(r[key], (m.get(r[key]) || 0) + 1), new Map())].sort((a, b) => b[1] - a[1])

function chart(list) {
  const svg = $('chart'); const w = svg.clientWidth || 700, h = 200, pad = 24
  const days = Number($('range').value) || Math.max(1, Math.ceil((Date.now() - Math.min(Date.now(), ...list.map(r => r.t))) / DAY))
  const start = new Date(); start.setHours(0, 0, 0, 0); const first = start.getTime() - (days - 1) * DAY
  const counts = Array.from({ length: days }, (_, i) => list.filter(r => r.t >= first + i * DAY && r.t < first + (i + 1) * DAY).length)
  const max = Math.max(1, ...counts), bw = (w - pad) / days
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`)
  svg.innerHTML = `<text x="0" y="12">${max}</text><line x1="${pad}" x2="${w}" y1="${h - 20}" y2="${h - 20}" stroke="#2a3537"/>` + counts.map((c, i) => {
    const bh = (c / max) * (h - 44), x = pad + i * bw + 2
    const d = new Date(first + i * DAY)
    const label = (days <= 14 || i % Math.ceil(days / 10) === 0) ? `<text x="${x + bw / 2 - 2}" y="${h - 6}" text-anchor="middle">${d.getDate()}.${d.getMonth() + 1}.</text>` : ''
    return `<rect x="${x}" y="${h - 20 - bh}" width="${Math.max(2, bw - 4)}" height="${bh}" rx="3" fill="url(#g)"><title>${d.toLocaleDateString('de-AT')}: ${c}</title></rect>${label}`
  }).join('') + '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e58bd0"/><stop offset="1" stop-color="#9fe3c0"/></linearGradient></defs>'
}

function render() {
  const list = inRange()
  const day = all.filter(r => r.t >= Date.now() - DAY).length
  const prev = all.filter(r => r.t >= Date.now() - 2 * DAY && r.t < Date.now() - DAY).length
  $('k-total').textContent = list.length
  $('k-day').textContent = day
  $('k-trend').textContent = prev || day ? (day >= prev ? '▲ ' : '▼ ') + Math.abs(day - prev) + ' zum Vortag' : 'ruhig'
  $('k-err').textContent = list.filter(r => r.level === 'error').length
  const versions = countBy(list, 'version')
  $('k-ver').textContent = versions.length
  $('k-latest').textContent = versions.length ? 'meist: ' + versions[0][0] : ' '
  $('k-inc').textContent = list.reduce((s, r) => s + r.incidents, 0)
  chart(list)
  bars($('by-level'), countBy(list, 'level'))
  bars($('by-version'), versions.slice(0, 8))
  bars($('by-platform'), countBy(list, 'platform').slice(0, 8))
  bars($('by-message'), countBy(list, 'message').slice(0, 8))
  $('rows').innerHTML = list.slice(0, 100).map(r => `<tr><td>${new Date(r.t).toLocaleString('de-AT', { dateStyle: 'short', timeStyle: 'short' })}</td><td><span class="lvl ${esc(r.level)}">${esc(r.level)}</span></td><td>${esc(r.message)}</td><td>${esc(r.version)}</td><td><code>${esc(r.details)}</code></td></tr>`).join('')
  $('note').hidden = list.length > 0; $('note').className = 'empty'; $('note').textContent = 'Keine Berichte im Zeitraum.'
}

$('reload').onclick = load
$('range').onchange = () => { store.set('jj-range', $('range').value); render() }
$('copy').onclick = async () => {
  const text = JSON.stringify(inRange().map(({ t, ...r }) => r), null, 2)
  try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Kopiert ✓' } catch { $('copy').textContent = 'Kopieren fehlgeschlagen' }
  setTimeout(() => { $('copy').textContent = 'Alles kopieren' }, 2000)
}
addEventListener('resize', () => all.length && chart(inRange()))
load()
setInterval(load, 60000)
</script>
</body>
</html>
