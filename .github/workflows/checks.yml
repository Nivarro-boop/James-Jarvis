name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is GitHub's standard Apple Silicon (arm64) runner label.
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # Fail loudly rather than silently running macOS checks on an Intel host or under Rosetta.
      - name: Apple-Silicon-Architektur bestätigen
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = "arm64"
          test "$(node -p 'process.arch')" = "arm64"
      # Die Regressionstests verwenden den Electron-Ersatz. Der getrennte
      # Integrationslauf unten startet danach tatsächlich Electron, ohne Installer.
      - name: Abhängigkeiten ohne Installationsskripte
        run: npm ci --ignore-scripts
      - name: Typen prüfen
        run: npm run typecheck
      - name: Tests
        run: npm test
      # Kein npm run build: dessen prebuild lädt zusätzliche Weckwortmodelle.
      - name: Anwendung bauen, ohne Installer oder Veröffentlichung
        run: npx --no-install electron-vite build
      - name: Electron-Laufzeit für echte Integration bereitstellen
        run: node node_modules/electron/install.js
      - name: Echte Electron-Integration unter Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/check-workspace-integration.cjs
      - name: Echte Electron-Integration unter Windows und macOS
        if: runner.os != 'Linux'
        run: node scripts/check-workspace-integration.cjs
      - name: Integrationsbefund und isolierte Testansicht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-integration-${{ matrix.os }}
          path: |
            out/audit/workspace-integration*
            out/audit/home-clean*
            out/audit/assistant-role*
          if-no-files-found: ignore
          retention-days: 7

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: error-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: error-dashboard/package-lock.json
      - name: Dashboard-Abhängigkeiten
        run: npm ci --ignore-scripts
      - name: Dashboard-Tests
        run: npm test
